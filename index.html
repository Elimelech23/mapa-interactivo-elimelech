<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Map Quest - Elimelech Attale</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#0b1226;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.land{fill:#1e3a5f;stroke:#3b82f6;stroke-width:.3;opacity:.9}
.pin{cursor:pointer;transition:r .2s}
.pin:hover{fill:#fde047}
.pulse{animation:p 1.6s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.pop{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body class="min-h-screen">
<div class="max-w-6xl mx-auto p-4">
  <header class="text-center my-4">
    <h1 class="text-3xl md:text-5xl font-extrabold bg-gradient-to-r from-sky-400 via-fuchsia-400 to-amber-300 bg-clip-text text-transparent">🌍 World Map Quest - Elimelech Attale</h1>
    <p class="text-slate-400 mt-2">Countries · Cities · Nationalities</p>
    <div class="mt-4 inline-flex rounded-xl bg-slate-800 p-1">
      <button id="bExp" class="px-5 py-2 rounded-lg font-semibold">🧭 Explore</button>
      <button id="bQuiz" class="px-5 py-2 rounded-lg font-semibold">🎯 Quiz</button>
    </div>
  </header>

  <div class="grid lg:grid-cols-3 gap-4">
    <div class="lg:col-span-2 rounded-2xl bg-slate-900/70 border border-slate-700 p-2">
      <svg id="map" viewBox="0 0 360 180" class="w-full rounded-xl bg-slate-950">
        <g stroke="#1e293b" stroke-width=".2" id="grid"></g>
        <g id="land"></g>
        <g id="pins"></g>
        <text id="mapLabel" x="180" y="176" text-anchor="middle" font-size="6" fill="#fde047"></text>
      </svg>
      <p class="text-xs text-slate-500 px-2 py-1">Tap a yellow-dot country on the map.</p>
    </div>

    <aside id="panel" class="rounded-2xl bg-slate-900/70 border border-slate-700 p-5"></aside>
  </div>

  <section class="mt-4 rounded-2xl bg-slate-900/70 border border-slate-700 p-5">
    <h2 class="font-bold text-amber-300 mb-2">📘 Rules</h2>
    <div class="grid md:grid-cols-3 gap-3 text-sm">
      <div class="bg-slate-800 rounded-xl p-3">Singular noun → <b>+ 's</b><br><i class="text-sky-300">France's capital</i></div>
      <div class="bg-slate-800 rounded-xl p-3">Regular plural (-s) → <b>+ '</b><br><i class="text-sky-300">the Americans' flag</i></div>
      <div class="bg-slate-800 rounded-xl p-3">Irregular plural → <b>+ 's</b><br><i class="text-sky-300">the people's president</i></div>
    </div>
  </section>

  <footer class="text-center text-slate-500 text-2xl mt-8 mb-4">
    Developed with 💙 by <span id="dev" class="text-sky-300 font-semibold"></span>
  </footer>
</div>

<script>
const DEV = "Elimelech Attale";
document.getElementById('dev').textContent = DEV;

const C = [
 ["United States","Washington, D.C.","American","🇺🇸",-77,39],
 ["Canada","Ottawa","Canadian","🇨🇦",-75.7,45.4],
 ["Mexico","Mexico City","Mexican","🇲🇽",-99,19.4],
 ["Colombia","Bogotá","Colombian","🇨🇴",-74,4.7],
 ["Peru","Lima","Peruvian","🇵🇪",-77,-12],
 ["Brazil","Brasília","Brazilian","🇧🇷",-47.9,-15.8],
 ["Argentina","Buenos Aires","Argentine","🇦🇷",-58.4,-34.6],
 ["United Kingdom","London","British","🇬🇧",-0.1,51.5],
 ["France","Paris","French","🇫🇷",2.3,48.9],
 ["Spain","Madrid","Spanish","🇪🇸",-3.7,40.4],
 ["Italy","Rome","Italian","🇮🇹",12.5,41.9],
 ["Germany","Berlin","German","🇩🇪",13.4,52.5],
 ["Turkey","Ankara","Turkish","🇹🇷",32.9,39.9],
 ["Russia","Moscow","Russian","🇷🇺",37.6,55.8],
 ["Egypt","Cairo","Egyptian","🇪🇬",31.2,30],
 ["Nigeria","Abuja","Nigerian","🇳🇬",7.5,9],
 ["Kenya","Nairobi","Kenyan","🇰🇪",36.8,-1.3],
 ["South Africa","Pretoria","South African","🇿🇦",28.2,-25.7],
 ["India","New Delhi","Indian","🇮🇳",77.2,28.6],
 ["China","Beijing","Chinese","🇨🇳",116.4,39.9],
 ["Japan","Tokyo","Japanese","🇯🇵",139.7,35.7],
 ["Australia","Canberra","Australian","🇦🇺",149.1,-35.3]
].map(([country,city,nat,flag,lon,lat],i)=>({i,country,city,nat,flag,x:lon+180,y:90-lat}));

const LAND = [
 [[-168,66],[-140,70],[-95,72],[-65,62],[-55,50],[-70,43],[-76,35],[-81,25],[-90,29],[-97,22],[-88,16],[-78,8],[-86,12],[-105,20],[-117,32],[-124,40],[-125,49],[-140,60]],
 [[-78,8],[-62,11],[-50,0],[-35,-7],[-40,-22],[-48,-27],[-58,-38],[-66,-46],[-70,-54],[-75,-48],[-72,-30],[-70,-18],[-81,-6]],
 [[-10,36],[-9,43],[-2,48],[5,53],[10,57],[5,62],[15,69],[30,71],[40,66],[40,55],[30,46],[28,41],[23,37],[15,38],[10,44],[3,43]],
 [[-17,21],[-10,35],[10,37],[32,31],[35,28],[43,12],[51,12],[40,-5],[40,-15],[33,-27],[20,-35],[15,-28],[12,-5],[9,4],[-8,4],[-17,14]],
 [[40,55],[50,68],[70,73],[100,77],[140,72],[170,68],[160,55],[142,48],[130,42],[122,38],[122,30],[110,20],[106,10],[100,13],[104,2],[98,8],[92,22],[80,8],[73,20],[66,25],[57,25],[48,29],[35,28],[36,36],[30,40],[40,45]],
 [[114,-22],[122,-18],[131,-12],[142,-11],[153,-26],[150,-37],[140,-38],[130,-32],[115,-34]],
 [[-55,60],[-45,60],[-20,70],[-20,80],[-60,82],[-70,77]],
 [[130,32],[135,34],[141,38],[142,44],[140,40],[136,36]]
];

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const sh = a => [...a].sort(()=>Math.random()-.5);
const gen = c => c.country.startsWith("United") ? `the ${c.country}'s` : `${c.country}'s`;

// ---- draw map
$('grid').innerHTML = [...Array(11)].map((_,i)=>`<line x1="0" x2="360" y1="${i*18}" y2="${i*18}"/>`).join('') + [...Array(19)].map((_,i)=>`<line y1="0" y2="180" x1="${i*20}" x2="${i*20}"/>`).join('');
$('land').innerHTML = LAND.map(p=>`<polygon class="land" points="${p.map(([lo,la])=>`${lo+180},${90-la}`).join(' ')}"/>`).join('');
const pins = $('pins');
C.forEach(c=>{
  const g = document.createElementNS(NS,'g');
  g.innerHTML = `<circle class="pin" data-i="${c.i}" cx="${c.x}" cy="${c.y}" r="2.4" fill="#f59e0b" stroke="#fff" stroke-width=".4"/><circle data-i="${c.i}" cx="${c.x}" cy="${c.y}" r="6" fill="transparent" style="cursor:pointer"/>`;
  g.onclick = () => pick(c.i);
  g.onmouseenter = () => $('mapLabel').textContent = Mode==='explore' ? `${c.flag} ${c.country}` : '';
  g.onmouseleave = () => $('mapLabel').textContent = '';
  pins.appendChild(g);
});

// ---- state
let Mode='explore', Sel=null, Q=null, n=0, score=0, streak=0, best=0, locked=false;
const TOTAL=10;

function setMode(m){
  Mode=m;
  $('bExp').className='px-5 py-2 rounded-lg font-semibold '+(m==='explore'?'bg-sky-500 text-white':'text-slate-300');
  $('bQuiz').className='px-5 py-2 rounded-lg font-semibold '+(m==='quiz'?'bg-fuchsia-500 text-white':'text-slate-300');
  if(m==='explore'){Sel=null;renderExplore();}
  else{n=0;score=0;streak=0;nextQ();}
}
$('bExp').onclick=()=>setMode('explore');
$('bQuiz').onclick=()=>setMode('quiz');

function highlight(i,color='#22c55e'){
  document.querySelectorAll('.pin').forEach(p=>{p.setAttribute('fill','#f59e0b');p.classList.remove('pulse')});
  if(i!=null){const p=document.querySelector(`.pin[data-i="${i}"]`);p.setAttribute('fill',color);p.classList.add('pulse');}
}

// ---- explore
function renderExplore(){
  highlight(Sel);
  if(Sel==null){
    $('panel').innerHTML=`<h2 class="text-xl font-bold mb-2">🧭 Explore mode</h2><p class="text-slate-400">Click any country on the map to discover its <b>capital</b>, <b>nationality</b> and example sentences with the <b class="text-amber-300">Saxon genitive</b>.</p>`;
    return;
  }
  const c=C[Sel];
  $('panel').innerHTML=`<div class="pop">
    <div class="text-6xl">${c.flag}</div>
    <h2 class="text-2xl font-bold mt-1">${c.country}</h2>
    <div class="grid grid-cols-2 gap-2 my-3 text-sm">
      <div class="bg-slate-800 rounded-xl p-3"><div class="text-slate-400">Capital city</div><b>${c.city}</b></div>
      <div class="bg-slate-800 rounded-xl p-3"><div class="text-slate-400">Nationality</div><b>${c.nat}</b></div>
    </div>
    <ul class="space-y-2 text-sm">
      <li class="bg-slate-800 rounded-xl p-3">${c.city} is <b class="text-amber-300">${gen(c)}</b> capital.</li>
      <li class="bg-slate-800 rounded-xl p-3"><b class="text-amber-300">${gen(c)}</b> flag is ${c.flag}.</li>
      <li class="bg-slate-800 rounded-xl p-3">A ${c.nat} ${c.nat.endsWith('ese')||c.nat==='Swiss'?'person':'citizen'}'s passport comes from ${c.country}.</li>
      <li class="bg-slate-800 rounded-xl p-3">The ${c.nat==='Chinese'||c.nat==='Japanese'?c.nat:c.nat+'s'}${c.nat.endsWith('ese')||c.nat==='British'?"'":"'"} culture is unique.</li>
    </ul></div>`;
}

// ---- quiz
function nextQ(){
  if(n>=TOTAL) return end();
  locked=false;n++;
  const c=C[Math.floor(Math.random()*C.length)];
  const t=['map','nat','gen','typed'][Math.floor(Math.random()*4)];
  const others=sh(C.filter(x=>x!==c));
  Q={t,c};
  if(t==='map'){Q.prompt=`Click the country: <b>${c.city}</b> is ___ capital. 🗺️`;}
  if(t==='nat'){Q.prompt=`She is from <b>${c.country}</b>. She is ___ . (nationality)`;Q.ans=c.nat;}
  if(t==='typed'){Q.prompt=`<b>${c.city}</b> is ___ capital. (write the country + 's)`;Q.ans=gen(c);}
  if(t==='gen'){
    const g=c.country, p=c.country+"s'";
    Q.prompt=`Which one is correct?`;
    Q.opts=sh([`${c.city} is ${g}'s capital.`,`${c.city} is ${p} capital.`,`${c.city} is capital of ${g}'s.`,`${c.city} is ${g} capital's.`]);
    Q.ans=`${c.city} is ${g}'s capital.`;
  }
  renderQ();
}
function renderQ(){
  highlight(null);
  let body='';
  if(Q.t==='nat'||Q.t==='typed') body=`<input id="inp" autocomplete="off" class="w-full mt-3 px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 focus:outline-none focus:border-fuchsia-400" placeholder="Type your answer…"><button id="chk" class="mt-3 w-full py-3 rounded-xl bg-fuchsia-500 font-bold">Check ✔</button>`;
  if(Q.t==='gen') body=`<div class="mt-3 space-y-2">${Q.opts.map((o,i)=>`<button data-o="${i}" class="opt w-full text-left px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700">${o}</button>`).join('')}</div>`;
  if(Q.t==='map') body=`<p class="text-slate-400 mt-3 text-sm">Tap the right dot on the map 👆</p>`;
  $('panel').innerHTML=`<div class="pop">
    <div class="flex justify-between text-sm mb-2"><span>Question ${n}/${TOTAL}</span><span>⭐ ${score} · 🔥 ${streak}</span></div>
    <div class="h-2 bg-slate-800 rounded"><div class="h-2 rounded bg-gradient-to-r from-sky-400 to-fuchsia-400" style="width:${(n-1)/TOTAL*100}%"></div></div>
    <p class="text-lg mt-4">${Q.prompt}</p>${body}<div id="fb" class="mt-4"></div></div>`;
  const inp=$('inp'); if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')answer(inp.value)};$('chk').onclick=()=>answer(inp.value);}
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(Q.opts[b.dataset.o]));
}
const norm = s => s.trim().toLowerCase().replace(/[’`]/g,"'");
function answer(v){
  if(locked) return;
  const ok = norm(v)===norm(Q.t==='map'?C[Q.c.i].country:Q.ans) || (Q.t==='typed' && norm(v)===norm(Q.c.country+"'s"));
  finish(ok);
}
function pick(i){
  if(Mode==='explore'){Sel=i;renderExplore();return;}
  if(locked||Q.t!=='map') return;
  finish(i===Q.c.i);
}
function finish(ok){
  locked=true;
  if(ok){score++;streak++;best=Math.max(best,streak);}else streak=0;
  const c=Q.c;
  highlight(c.i,ok?'#22c55e':'#ef4444');
  const right = Q.t==='map'?`${c.flag} ${c.country}`:Q.ans;
  $('fb').innerHTML=`<div class="pop rounded-xl p-4 ${ok?'bg-emerald-500/20 border border-emerald-400':'bg-rose-500/20 border border-rose-400'}">
    <b>${ok?'🎉 Great job!':'❌ Not quite.'}</b> ${ok?'':`Answer: <b>${right}</b>`}
    <p class="text-sm mt-1 text-slate-300">${c.city} is ${gen(c)} capital · Nationality: ${c.nat}</p>
    <button id="nx" class="mt-3 w-full py-2 rounded-lg bg-sky-500 font-bold">${n>=TOTAL?'See results 🏁':'Next ➜'}</button></div>`;
  $('nx').onclick=nextQ;
}
function end(){
  highlight(null);
  const pct=score/TOTAL, medal=pct>=.9?'🏆':pct>=.6?'🥈':'🌱';
  $('panel').innerHTML=`<div class="pop text-center"><div class="text-6xl">${medal}</div>
    <h2 class="text-2xl font-bold mt-2">${score}/${TOTAL} correct</h2>
    <p class="text-slate-400 mt-1">Best streak: 🔥 ${best}</p>
    <button id="again" class="mt-4 w-full py-3 rounded-xl bg-fuchsia-500 font-bold">Play again 🔄</button></div>`;
  $('again').onclick=()=>setMode('quiz');
}

setMode('explore');
</script>
</body>
</html>
